# Minimal tmux config for the Agent Sandbox: persistence only, no UI.
#
# Selection/copy is handled on the client: the plugin strips application
# mouse-tracking in xterm.js (terminal-view.ts) so drag-to-select and
# auto-copy keep working even when a full-screen TUI like Claude Code would
# otherwise enable mouse reporting. tmux stays out of the way (mouse off).
# atuin's bash-preexec hooks fire correctly inside tmux with
# bash-preexec 0.5.0 + atuin 18.8.0 (the historical commit-f14ead7
# regression is gone).

# No status line; we use tmux purely as a persistence layer.
set -g status off

# Don't steal mouse events from xterm.js (selection, auto-copy,
# Ctrl+Shift+V paste all go straight through).
set -g mouse off

# Kill the prefix key. Only one tmux action is needed day-to-day,
# detach, and we bind it directly to Ctrl-\.
unbind C-b
bind-key -n C-\\ detach-client

# Truecolor passthrough for 256-color / 24-bit rendering.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Disable the alternate screen so programs that would normally use it
# (less, man, etc.) output to the main screen instead. Without this,
# tmux takes over the alternate screen and xterm.js scrollback stops
# working; you can't scroll up past what's currently visible.
# -ga appends; -g would replace and drop the :Tc flag set earlier.
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"

# Keep copy-mode keybindings out of the way (we never enter copy
# mode; xterm.js handles scrollback).
set -g mode-keys emacs
