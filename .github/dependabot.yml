version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    # Route dependabot PRs to the maintainer so they don't sit unassigned
    # while the cooldown window elapses. Without this, the cooldown's
    # supply-chain-risk justification is undercut; the PR may auto-pass
    # checks and merge timing depends entirely on incidental review.
    assignees:
      - artislismanis
    # Wait before opening a PR on a fresh release; buys time for the
    # community to spot a compromised action republish (cf. tj-actions /
    # changed-files, July 2025). The github-actions ecosystem doesn't expose
    # semver granularity to cooldown, so a single default-days applies to all
    # bumps (actions are git-tag pinned, not strict semver, anyway).
    cooldown:
      default-days: 3
    # Group all minor/patch action bumps into one weekly PR so reviewers
    # see a coherent bump set instead of one PR per action. Majors stay
    # ungrouped; they may have breaking API or input changes that
    # deserve their own review path.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/plugin"
    # Weekly batches with grouping; daily-per-dep churn was unreviewable.
    schedule:
      interval: weekly
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "deps"
      include: scope
    assignees:
      - artislismanis
    open-pull-requests-limit: 10
    # Same rationale as the github-actions cooldown above. npm has a
    # measurable rate of "supply-chain"-class incidents (eslint-config-
    # prettier 2024, chalk 2024); a 3-day patch / 7-day major delay lets
    # upstream yank or detect before we auto-merge.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # Block specific majors that break our tree or need deliberate migration.
    # Minor/patch bumps still flow normally. Lift each rule when the noted
    # blocker resolves.
    ignore:
      # @types/node: track the runtime Node major (currently 24 LTS). Types
      # 25 surfaces APIs that don't exist at runtime. Lift on Node 26 LTS
      # (or when we ship a non-LTS runtime). Pinned by explicit version range
      # rather than `version-update:semver-major`: @types/node doesn't follow
      # strict semver, so the semver-major classifier kept letting 25.x PRs
      # through (#78, #108, #216). Bump the floor when the runtime moves.
      - dependency-name: "@types/node"
        versions:
          - ">=25"
      # typescript: now on 6.x. Block the next major (7.0) until
      # typescript-eslint confirms support — TS majors routinely break the
      # eslint peer-dep chain. Minors/patches under 6.x flow via the
      # typescript group.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # mocha: v11 changed module exports; our e2e specs do
      # `import { describe, it } from "mocha"` which returns undefined.
      # Lift when we either pin mocha differently in e2e or refactor the
      # imports to match v11's shape.
      - dependency-name: "mocha"
        update-types:
          - "version-update:semver-major"
      # @xterm/xterm: v6 has real breaking changes (overviewRulerWidth
      # renamed, alt-to-ctrl+arrow mapping removed, canvas renderer dropped,
      # windowsMode/fastScrollModifier removed). Our usage is light enough
      # to likely survive, but a deliberate migration PR (with manual
      # terminal smoke testing across platforms) is the safer path than
      # a drive-by dependabot merge.
      - dependency-name: "@xterm/xterm"
        update-types:
          - "version-update:semver-major"
    # Group related ecosystems into single PRs so reviewers see one
    # coherent bump set instead of N separate PRs that all touch the
    # lockfile. Patterns are evaluated in order; first match wins.
    #
    # `update-types: [minor, patch]` on each named group keeps major
    # bumps as separate PRs; a major usually has migration notes the
    # reviewer should read separately from a routine patch sweep.
    groups:
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "tslib"
        update-types:
          - "minor"
          - "patch"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
        update-types:
          - "minor"
          - "patch"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitest-*"
        update-types:
          - "minor"
          - "patch"
      wdio:
        patterns:
          - "@wdio/*"
          - "webdriverio"
          - "wdio-*"
        update-types:
          - "minor"
          - "patch"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
        update-types:
          - "minor"
          - "patch"
      obsidian:
        patterns:
          - "obsidian"
          - "@codemirror/*"
          - "@lezer/*"
        update-types:
          - "minor"
          - "patch"
      # Catch-all for ungrouped deps (esbuild, husky, lint-staged, mocha,
      # tsx, zod, @xterm/*, builtin-modules, etc.). Without this, each
      # opens its own PR and reviewer fatigue kicks in. Place last so
      # named groups still match first.
      other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Watch the Dockerfile base image and any FROM pins for upstream tag bumps.
  - package-ecosystem: docker
    directory: "/container"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "container"
      include: scope
    assignees:
      - artislismanis
    # The docker ecosystem doesn't expose semver granularity to cooldown, so
    # a single default-days applies. Majors and interims are blocked by the
    # ignore rule below, so the cooldown only governs the 24.04.x patch tags.
    cooldown:
      default-days: 3
    # Ubuntu base image: pin to the 24.04 LTS line (supported to April 2029).
    # Block both majors (26.04) and minors — the minor bumps are interim
    # releases (24.10, 25.10) with only 9-month support; 24.04→24.10 is a
    # semver-minor, which is how #220 slipped through a major-only ignore.
    # Only 24.04.x patch tags flow. Lift / re-target when adopting the next
    # LTS (26.04), after auditing that every apt-installed tool still resolves.
    ignore:
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
